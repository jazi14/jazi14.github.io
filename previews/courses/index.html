<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Learning Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Learning Hub">
<meta name="theme-color" content="#F97316">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-first column under a sticky tab bar. Passages are set large in Lexend (a face built for reading fluency);
   controls in Atkinson Hyperlegible. Highlighter yellow marks his choices and progress through the text. */
:root{
  --paper:#F4F7F8; --card:#FFFFFF; --ink:#13212B; --ink-2:#425360; --muted:#6B7D8A; --rule:#D7E0E5;
  --action:#1B6884; --action-ink:#FFFFFF; --action-soft:#E1EEF3;
  --hl:#FBE184; --hl-ink:#13212B;
  --good:#1F7546; --good-soft:#DFF1E6; --warn:#8E6210; --warn-soft:#FAEFD6; --bad:#AE3427; --bad-soft:#FAE3DF;
  --s1:#2a78d6; --s2:#eb6834;
  --f-read:"Lexend","Atkinson Hyperlegible",system-ui,sans-serif;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --navh:48px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0C151B; --card:#13202A; --ink:#E5EDF1; --ink-2:#A7B6C0; --muted:#7E909B; --rule:#253642;
  --action:#5AAFCC; --action-ink:#05131A; --action-soft:#163240;
  --hl:#5C5015; --hl-ink:#F7EFCB;
  --good:#5BC489; --good-soft:#12301F; --warn:#E3AE52; --warn-soft:#31260F; --bad:#F07C70; --bad-soft:#381914;
  --s1:#3987e5; --s2:#d95926; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0C151B; --card:#13202A; --ink:#E5EDF1; --ink-2:#A7B6C0; --muted:#7E909B; --rule:#253642;
  --action:#5AAFCC; --action-ink:#05131A; --action-soft:#163240;
  --hl:#5C5015; --hl-ink:#F7EFCB;
  --good:#5BC489; --good-soft:#12301F; --warn:#E3AE52; --warn-soft:#31260F; --bad:#F07C70; --bad-soft:#381914;
  --s1:#3987e5; --s2:#d95926; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
h1,h2,h3{font-family:var(--f-read);text-wrap:balance;margin:0}
h1{font-size:1.45rem;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
header.top{padding-block:18px 10px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
header.top .sub{color:var(--ink-2);font-size:.95rem}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font:inherit;font-weight:700;font-size:.95rem;background:none;border:0;color:var(--ink-2);padding:12px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--action)}
section.view{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-weight:700;border-radius:10px;border:1.5px solid var(--action);background:var(--action);color:var(--action-ink);padding:10px 16px;min-height:44px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--action)}
.btn.quiet{background:transparent;border-color:var(--rule);color:var(--ink-2)}
.btn.big{font-size:1.1rem;padding:14px 22px;min-height:54px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible{outline:3px solid var(--action);outline-offset:2px}
select,input[type=text],input[type=number],input[type=date]{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--rule);border-radius:10px;padding:9px 10px;min-height:44px;max-width:100%}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-weight:700;background:var(--card);color:var(--ink-2);border:0;border-right:1px solid var(--rule);padding:9px 14px;min-height:44px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--action-soft);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.above{background:var(--good-soft);color:var(--good)}
.chip.at{background:var(--action-soft);color:var(--action)}
.chip.below{background:var(--warn-soft);color:var(--warn)}
.chip.well{background:var(--bad-soft);color:var(--bad)}
/* scoreboard */
.board{display:flex;flex-direction:column}
.board .m{display:grid;grid-template-columns:1fr;gap:8px;padding-block:12px;border-top:1px solid var(--rule)}
.board .m:first-child{border-top:0;padding-top:0}
.board .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.board .v{font-family:var(--f-read);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.board .v.none{font-size:1rem;color:var(--muted);font-weight:500}
.board .v small{font-size:.8rem;font-weight:500;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:3px;min-width:0}
.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.task{border:1px solid var(--rule);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.task .when{font-weight:700;color:var(--action)}
.notes{display:flex;flex-direction:column;gap:10px}
.note{border-left:4px solid var(--rule);padding:4px 0 4px 12px}
.note.warn{border-left-color:var(--warn)} .note.good{border-left-color:var(--good)} .note.info{border-left-color:var(--action)}
.note h3{font-family:var(--f-ui);font-weight:700}
/* passages */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh));z-index:4;background:var(--paper);padding-block:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--rule)}
.clock{font-family:var(--f-read);font-weight:600;font-size:2rem;font-variant-numeric:tabular-nums;min-width:4.2ch;line-height:1}
.clock.low{color:var(--bad)}
.passage{font-family:var(--f-read);font-size:1.32rem;line-height:1.7;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:20px 18px;overflow-wrap:break-word}
.passage p+p{margin-top:.9em}
.passage .ttl{font-weight:600;margin-bottom:.6em;font-size:1.05em}
.w{border-radius:4px;cursor:default}
.passage.tappable .w{cursor:pointer}
.w.miss{text-decoration:underline wavy var(--bad);text-underline-offset:5px;text-decoration-thickness:2px}
.w.past{opacity:.35}
.w.end{background:var(--hl);color:var(--hl-ink);box-shadow:0 0 0 3px var(--hl)}
.passage.clean .w.miss{text-decoration:none}
.prompt{background:var(--hl);color:var(--hl-ink);border-radius:10px;padding:10px 14px;font-weight:700}
.result{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.result .v{font-family:var(--f-read);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{font:inherit;font-weight:700;width:44px;height:44px;border-radius:10px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.missbtn{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
/* maze */
.maze{font-size:1.12rem;line-height:2.25}
.mz{display:inline-flex;flex-wrap:wrap;max-width:100%;vertical-align:middle;border:1.5px solid var(--rule);border-radius:9px;overflow:hidden;margin:2px 1px;line-height:1.3;background:var(--card)}
.mz button{font:inherit;font-size:.95em;font-family:var(--f-read);padding:5px 9px;border:0;border-left:1px solid var(--rule);background:transparent;color:var(--ink);min-height:38px;cursor:pointer}
.mz button:first-child{border-left:0}
.mz button[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink);font-weight:600}
.maze.locked .mz button{cursor:default}
.mz.ok button[aria-pressed="true"]{background:var(--good-soft);color:var(--good)}
.mz.no button[aria-pressed="true"]{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.mz.no button.ans,.mz.skip button.ans{box-shadow:inset 0 0 0 2px var(--good);color:var(--good);font-weight:600}
.mz.skip{border-style:dashed;border-color:var(--warn)}
.mz.unreached{opacity:.5}
.howto{display:flex;flex-direction:column;gap:6px;font-family:var(--f-read);font-size:1.05rem}
/* progress */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block}
.sw.ref{width:16px;height:0;border-top:2px dashed var(--muted);border-radius:0}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:.82rem;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-115%);z-index:3}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.del{font:inherit;font-size:.82rem;background:none;border:1px solid var(--rule);border-radius:8px;color:var(--ink-2);padding:4px 8px;cursor:pointer;min-height:32px}
.del.confirm{border-color:var(--bad);color:var(--bad)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--ink-2);font-weight:700}
/* plan */
.prose{display:flex;flex-direction:column;gap:12px;max-width:66ch}
.prose ul,.prose ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
details{border:1px solid var(--rule);border-radius:12px;background:var(--card)}
details>summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style-position:inside}
details>div{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.status{font-size:.82rem;color:var(--muted);padding-top:24px}
.reader{position:fixed;inset:0;z-index:20;background:var(--paper);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.reader .passage{font-size:1.5rem;max-width:760px;margin:0 auto}
.reader .close{position:sticky;top:0;display:flex;justify-content:flex-end;max-width:760px;margin:0 auto 10px}
@media (max-width:480px){
  nav.tabs button{padding:12px 9px 10px;font-size:.9rem}
  .passage{font-size:1.18rem;padding:16px 14px}
  .maze{font-size:1.04rem}
  .clock{font-size:1.7rem}
  .board .v{font-size:1.15rem}
}
@media (prefers-reduced-motion:no-preference){ .btn,.seg button,.mz button{transition:background-color .12s ease,color .12s ease} }

/* Hub additions on top of styles.base.css (the Reading Trainer system: Lexend for reading, Atkinson Hyperlegible for controls,
   teal for actions, highlighter yellow for the student's own marks). Layout: one phone-first column; the lesson player is a
   full-page focus view with its own top bar. */
:root{ --focus:#0B4F66; --shown:#8E6210; --shown-soft:#FAEFD6; --fixed:#1B6884; --fixed-soft:#E1EEF3; --figure:#FFFFFF; --figure-ink:#13212B; --shade:rgba(19,33,43,.06); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --focus:#8FD0E6; --shown:#E3AE52; --shown-soft:#31260F; --fixed:#5AAFCC; --fixed-soft:#163240; --figure:#F4F7F8; --figure-ink:#13212B; --shade:rgba(229,237,241,.07); }}
:root[data-theme="dark"]{ --focus:#8FD0E6; --shown:#E3AE52; --shown-soft:#31260F; --fixed:#5AAFCC; --fixed-soft:#163240; --figure:#F4F7F8; --figure-ink:#13212B; --shade:rgba(229,237,241,.07); }

header.top .sync{font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
header.top .sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
header.top .sync.ok::before{background:var(--good)} header.top .sync.busy::before{background:var(--warn)} header.top .sync.err::before{background:var(--bad)}
header.top .who{display:flex;flex-direction:column;gap:2px;min-width:0}
h2 small{font-family:var(--f-ui);font-weight:400;font-size:.85rem;color:var(--muted)}
.hint{color:var(--ink-2);font-size:.92rem}
.pill{display:inline-flex;align-items:center;font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--action-soft);color:var(--action);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.plain{background:var(--shade);color:var(--ink-2)}
.empty{border:1.5px dashed var(--rule);border-radius:12px;padding:16px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.banner{border-radius:10px;padding:10px 14px;background:var(--warn-soft);color:var(--warn);font-weight:700}
.banner.info{background:var(--action-soft);color:var(--action)}

/* Today */
.daybar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.week{display:flex;gap:6px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;color:var(--muted);font-weight:700;width:34px}
.week .d i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);display:block;background:var(--card)}
.week .d.part i{background:var(--hl);border-color:var(--hl)} .week .d.full i{background:var(--good);border-color:var(--good)} .week .d.off i{border-style:dashed;background:transparent}
.week .d.now{color:var(--ink)} .week .d.now i{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--action)}
.tlist{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding-block:14px;border-top:1px solid var(--rule)}
.trow:first-child{border-top:0;padding-top:2px}
.trow .mark{width:26px;height:26px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:transparent}
.trow.done .mark{background:var(--good);border-color:var(--good);color:var(--card)} .trow.doing .mark{border-color:var(--action);background:var(--action-soft)}
.trow .what{display:flex;flex-direction:column;gap:2px;min-width:0}
.trow .what b{font-family:var(--f-read);font-weight:600;font-size:1.05rem}
.trow .what span{color:var(--ink-2);font-size:.92rem;overflow-wrap:anywhere}
.trow.done .what b{color:var(--ink-2)}
.trow .extra{grid-column:2 / -1}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.inline label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;font-weight:700;color:var(--ink-2);flex:1 1 130px;min-width:0}
.inline input{width:100%}
textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--rule);border-radius:10px;padding:10px;min-height:84px;width:100%;resize:vertical}

/* lesson list */
.llist{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding-block:12px;border-top:1px solid var(--rule)}
.lrow:first-child{border-top:0;padding-top:0}
.lrow .t{font-family:var(--f-read);font-weight:600}
.lrow .s{color:var(--ink-2);font-size:.9rem;grid-column:1}
.meter{height:8px;border-radius:99px;background:var(--shade);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--action);border-radius:99px}
.meter.good i{background:var(--good)} .meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}

/* lesson player */
#v-lesson{padding-top:0;gap:14px}
.ptop{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);display:flex;flex-direction:column;gap:8px;padding-block:10px 8px;border-bottom:1px solid var(--rule);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ptop .line{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ptop .ttl{font-family:var(--f-read);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ptop .count{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink-2);white-space:nowrap}
.ptop .tclock{font-family:var(--f-read);font-weight:600;font-variant-numeric:tabular-nums;font-size:1.15rem}
.ptop .tclock.low{color:var(--bad)}
.strip{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;min-width:30px;height:30px;border-radius:8px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink-2);font:inherit;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;padding:0 4px}
.strip button.first{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.strip button.fixed{background:var(--fixed-soft);border-color:var(--fixed);color:var(--fixed)}
.strip button.shown{background:var(--shown-soft);border-color:var(--shown);color:var(--shown)}
.strip button.part{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.strip button.saved{background:var(--action-soft);border-color:var(--action);color:var(--action)}
.strip button[aria-current="true"]{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--focus)}
.strip .gap{flex:0 0 auto;width:1px;background:var(--rule);margin-inline:3px}
.qcard{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.qhead .qn{font-family:var(--f-read);font-weight:700;font-size:1.05rem}
.qtext{font-family:var(--f-read);font-size:1.2rem;line-height:1.55;white-space:pre-line;overflow-wrap:break-word}
.fig{background:var(--figure);border:1px solid var(--rule);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.fig img{max-width:100%;height:auto;display:block}
.fig figcaption,.fig .cap{font-size:.8rem;color:#425360}
.qtable{overflow-x:auto}
.qtable table{width:auto;min-width:50%;font-family:var(--f-read);font-size:1.02rem}
.qtable th,.qtable td{padding:6px 16px 6px 0;font-variant-numeric:tabular-nums}
.parts{display:flex;flex-direction:column;gap:14px}
.prow{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px dashed var(--rule)}
.prow:first-child{border-top:0;padding-top:0}
.prow .pp{font-family:var(--f-read);font-size:1.1rem;line-height:1.5;white-space:pre-line}
.prow .pp b{font-weight:700;margin-right:6px}
.ansline{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ansline .pre,.ansline .unit{font-family:var(--f-read);font-size:1.15rem;color:var(--ink-2)}
input.ans{font-family:var(--f-read);font-size:1.25rem;min-height:52px;padding:8px 12px;border:2px solid var(--rule);border-radius:12px;background:var(--card);color:var(--ink);flex:1 1 150px;min-width:0;max-width:340px}
input.ans:disabled,textarea:disabled{opacity:1;background:var(--shade);-webkit-text-fill-color:var(--ink)}
.prow.ok input.ans{border-color:var(--good);background:var(--good-soft)} .prow.no input.ans{border-color:var(--bad)} .prow.out input.ans{border-color:var(--shown);background:var(--shown-soft)} .prow.nudge input.ans{border-color:var(--warn)}
.verdict{font-weight:700;font-size:.95rem;display:inline-flex;align-items:center;gap:6px}
.prow.ok .verdict{color:var(--good)} .prow.no .verdict{color:var(--bad)} .prow.out .verdict{color:var(--shown)} .prow.nudge .verdict,.prow.bad .verdict{color:var(--warn)}
.pmsg{font-size:.95rem;color:var(--ink-2)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{font-family:var(--f-read);font-size:1.08rem;text-align:left;border:2px solid var(--rule);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;min-height:50px;cursor:pointer}
.opts button[aria-pressed="true"]{border-color:var(--focus);background:var(--hl);color:var(--hl-ink)}
.prow.ok .opts button[aria-pressed="true"]{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.prow.out .opts button.key{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.prow.out .opts button[aria-pressed="true"]:not(.key),.prow.no .opts button[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opts button:disabled{cursor:default;opacity:1}
.symbar{display:flex;flex-wrap:wrap;gap:6px}
.symbar button{font-family:var(--f-read);font-size:1.1rem;min-width:44px;height:42px;border-radius:10px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--good-soft);color:var(--good)} .fb.no{background:var(--bad-soft);color:var(--bad)} .fb.out{background:var(--shown-soft);color:var(--shown)} .fb.info{background:var(--action-soft);color:var(--action)}
.fb b{font-family:var(--f-read);font-weight:600;font-size:1.05rem}
.fb p{color:var(--ink)}
.sol{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.sol ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-family:var(--f-read);font-size:1.02rem}
.why{display:flex;flex-wrap:wrap;gap:8px}
.why button{font:inherit;font-weight:700;border:1.5px solid var(--rule);background:var(--card);color:var(--ink-2);border-radius:999px;padding:8px 14px;min-height:42px;cursor:pointer}
.why button[aria-pressed="true"]{background:var(--action-soft);border-color:var(--action);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.actions .grow{flex:1}
.linkbtn{font:inherit;background:none;border:0;color:var(--action);font-weight:700;text-decoration:underline;cursor:pointer;padding:8px 2px;min-height:40px}
.scene{background:var(--action-soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.scene h3{color:var(--action)}
.scene p{font-family:var(--f-read);line-height:1.6}
.scene .ask{font-style:italic;color:var(--ink-2)}
.teach{display:flex;flex-direction:column;gap:8px}
.teach .ex{border-left:3px solid var(--action);padding-left:12px;display:flex;flex-direction:column;gap:4px;font-family:var(--f-read)}
.teach .ex ol{margin:0;padding-left:1.2em}
.partlist{display:flex;flex-direction:column;gap:6px}
.partlist div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--rule);padding-top:6px}
.partlist div:first-child{border-top:0;padding-top:0}
.bignum{font-family:var(--f-read);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}

/* progress */
.wgrid{display:grid;grid-template-columns:minmax(96px,1.4fr) repeat(7,minmax(26px,1fr));gap:6px 4px;align-items:center;font-size:.85rem}
.wgrid .h{font-size:.7rem;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.wgrid .n{font-weight:700;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wgrid .c{height:24px;border-radius:6px;background:var(--shade);display:grid;place-items:center;font-size:.72rem;font-weight:700;color:transparent}
.wgrid .c.done{background:var(--good);color:var(--card)} .wgrid .c.part{background:var(--hl);color:var(--hl-ink)} .wgrid .c.none{background:transparent;border:1px dashed var(--rule)} .wgrid .c.miss{background:var(--bad-soft)}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:4px 10px;align-items:center;padding-block:8px;border-top:1px solid var(--rule)}
.skill:first-child{border-top:0}
.skill .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.skill .ct{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.88rem;white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.attn{display:flex;flex-direction:column;gap:10px}
.rev{border:1px solid var(--rule);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.rev .qq{font-family:var(--f-read)}
.rev .his{background:var(--hl);color:var(--hl-ink);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.rev .model{background:var(--good-soft);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:30;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.92rem;max-width:calc(100% - 32px);text-align:center}
.toast.warn{background:var(--bad);color:#fff}
.pin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pin input{width:120px;letter-spacing:.3em;text-align:center;font-size:1.2rem}
@media (max-width:480px){
  .qtext{font-size:1.1rem} .prow .pp{font-size:1.04rem} input.ans{font-size:1.15rem;max-width:none}
  .skill{grid-template-columns:minmax(0,1fr) 70px auto}
  .week .d{width:30px} .week .d i{width:22px;height:22px}
  nav.tabs button{padding:12px 8px 10px;font-size:.88rem}
}
@media (prefers-reduced-motion:no-preference){ .opts button,.strip button,.why button,input.ans{transition:background-color .12s ease,border-color .12s ease} }

/* Reading module layout helpers (reading.js). Tokens come from styles.base.css. */
.rd-split{justify-content:space-between;align-items:baseline}
.rd-strong{font-weight:700}
.rd-ink2{color:var(--ink-2)}
.rd-full{width:100%}
.rd-pick{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;min-width:0}
.rd-pick label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--ink-2);font-weight:700;min-width:0;max-width:100%;flex:1 1 220px}
.rd-pick select{width:100%}
.rd-acthead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.rd-acthead .what{font-family:var(--f-read);font-weight:600;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.sw.rd-s1{background:var(--s1)}
.sw.rd-s2{background:var(--s2)}
.sw.rd-dia{background:var(--card);border:2px solid var(--ink);border-radius:2px;transform:rotate(45deg);width:10px;height:10px}
#v-reading .form input,#v-reading .form select{width:100%}
#v-activity .passage{min-width:0}

/* New idea cards (lesson player) and the answer book. */
.lhead{display:flex;gap:6px;flex-wrap:wrap}
.ltitle{font-size:1.5rem;line-height:1.25;margin:2px 0 0}
.lframe{align-items:stretch}
.lfigwrap{margin:0;background:#fff;border-radius:12px;display:flex;justify-content:center;padding:4px}
.lfig{width:100%;max-width:420px;height:auto;display:block}
.ltext{font-size:1.12rem;line-height:1.5;margin:0}
.lnav{display:flex;align-items:center;gap:10px;justify-content:space-between}
.lnav .btn[hidden]{display:inline-flex!important;visibility:hidden}
.ldots{display:flex;gap:6px;justify-content:center;flex:1}
.ldots span{width:10px;height:10px;border-radius:50%;background:var(--rule)}
.ldots span.on{background:var(--action)}
.lex .lsteps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:1.05rem;line-height:1.45}
.lans{font-size:1.1rem;margin:0}
.lrule{background:var(--hl);color:#13212B;border-radius:12px;padding:12px 14px}
.lrule p{margin:4px 0 0}
.partlist small.idea{display:block;color:var(--ink-2);font-size:.82rem;margin-top:2px}
.asec{padding:10px 2px 0}
.asec h2{margin:6px 0 2px}
.aidea{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;margin:8px 0}
.aidea summary{cursor:pointer;font-weight:700}
.aidea-body{display:flex;flex-direction:column;gap:12px;padding-top:10px}
.aq .apart{border-top:1px solid var(--rule);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.akey,.atry{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.akey .label,.atry .label{min-width:84px}
.akey .kv{font-weight:700;font-size:1.05rem}
.atry .av{font-size:1.02rem}
.atry .amark{font-size:.8rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--bad-soft);color:var(--bad)}
.atry.ok .amark{background:var(--good-soft);color:var(--good)}
.atry .amark.plain{background:transparent;color:var(--ink-2);padding:0}
@media print{
  header.top,nav.tabs,.noprint,.toast,.ptop .btn{display:none!important}
  body{background:#fff}
  .card,.aq{break-inside:avoid;border-color:#bbb}
  .aidea[open] .aidea-body{display:flex}
}
.adec{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.adec.set{border-color:var(--action);background:var(--action-soft)}
.adec p{margin:4px 0 0}
.adecbtns .btn[aria-pressed="true"]{background:var(--action);color:var(--action-ink)}
#decNote,.aremark textarea,#genRemark{font:inherit;width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink)}
.aremark{display:flex;flex-direction:column;gap:8px}
.anote{border-left:4px solid var(--action);padding:4px 0 4px 10px}
.anote p{margin:2px 0 0}
/* iPad and other touch screens (12 Nov 2026). iPad Safari zooms into any text box under 16px, so none are. */
input:not(.ans),select,textarea{font-size:16px!important}
button[data-n]{min-width:44px}
@media (any-pointer:coarse){
  .strip{gap:6px}
  .strip button{min-width:40px;height:40px;font-size:.92rem}
}
@media (min-width:900px){.lfig{max-width:560px}}
.acu{font-size:.9rem;margin:2px 0;padding:6px 10px;border-radius:8px;background:var(--hl);color:#13212B}
.acu.ok{background:var(--good-soft);color:var(--good)}

/* Read and write module (write.js). Tokens come from styles.base.css. */
.cw-pass .pn{display:inline-block;min-width:1.6em;margin-right:.35em;font-family:var(--f-ui);font-size:.72rem;font-weight:700;color:var(--muted);vertical-align:.2em}
.cw-src{margin-top:.8em}
.cw-steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.cw-steps li{font-size:.78rem;font-weight:700;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;color:var(--muted);background:var(--card)}
.cw-steps li.done{color:var(--good);border-color:var(--good)}
.cw-steps li.now{color:var(--action-ink);background:var(--action);border-color:var(--action)}
.cw-write{min-height:260px;font-family:var(--f-read);font-size:1.12rem;line-height:1.6}
#cwGist{font-family:var(--f-read);font-size:1.12rem;line-height:1.55}
.cw-msg:empty{display:none}
.cw-msg{color:var(--warn);font-weight:700}
.cw-plan{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-family:var(--f-read);font-size:1.02rem}
.cw-three{flex-wrap:wrap}
.cw-three .btn[aria-pressed="true"]{background:var(--action);color:var(--action-ink)}
.cw-marks{display:flex;flex-direction:column;gap:6px}
.cw-mrow{display:flex;flex-direction:column;gap:2px}
.cw-rrow{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px dashed var(--rule)}
.cw-lab{font-weight:700;font-size:.9rem;color:var(--ink-2)}
.cw-aq{padding-top:8px;border-top:1px dashed var(--rule)}
.cw-aq:first-of-type{border-top:0}
.cw-good{color:var(--good)} .cw-bad{color:var(--bad)}
.cw-para{white-space:pre-wrap}
.cw-copy{font-size:1.15rem;line-height:1.6;user-select:none;-webkit-user-select:none}
#spType{font-family:var(--f-read);font-size:1.1rem}
#v-write .passage{min-width:0}

/* Research module (research.js). Tokens come from styles.base.css. */
.rs-read{font-family:var(--f-read);font-size:1.06rem;line-height:1.6;margin:.5em 0}
.rs-exs{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.rs-ex{border-left:3px solid var(--action);padding:4px 0 4px 12px}
.rs-ex .label{font-weight:700;font-size:.85rem;color:var(--ink-2)}
.rs-ex .rs-read{margin:.2em 0}
.rs-pick{flex-direction:column;align-items:stretch}
.rs-pick button{text-align:left;white-space:normal;line-height:1.35}
.rs-opt{color:var(--ink-2)}
.rs-box{min-height:120px}
.rs-line{width:100%;box-sizing:border-box}
.rs-own{font:inherit;font-size:1.05rem;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink);min-height:44px;width:100%;box-sizing:border-box;margin-bottom:6px}
.rs-exd{margin:8px 0;border:1px dashed var(--rule);border-radius:10px;padding:6px 12px}
.rs-exd summary{cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center}
.rs-ladder{list-style:none;margin:6px 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.rs-ladder li{font-size:.78rem;font-weight:700;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;color:var(--muted);background:var(--card)}
.rs-ladder li.done{color:var(--good);border-color:var(--good)}
.rs-ladder li.now{color:var(--action-ink);background:var(--action);border-color:var(--action)}
#v-research .cw-steps li{max-width:100%}

/* Hosted version only: sign-in screens, account button, People card. */
.gate{position:fixed;inset:0;z-index:1000;background:var(--paper);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,8vh) 16px 24px;overflow:auto}
.gate-card{width:100%;max-width:420px}
.gate-form{display:flex;flex-direction:column;gap:12px}
.gate-field{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.92rem}
.gate-field input,.people input,.people select{font:inherit;font-weight:400;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink);min-height:44px;width:100%;box-sizing:border-box}
.gate-msg{color:var(--bad);min-height:1.3em;margin:0}
.gate-link{background:none;border:0;color:var(--action);font:inherit;text-decoration:underline;cursor:pointer;padding:8px 0;text-align:left;min-height:44px}
.gate-row{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
html.gated .wrap{visibility:hidden}
.acct{font:inherit;font-size:.85rem;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.people-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0 0;border-top:1px solid var(--rule);margin:0}
.people-row .grow{flex:1;min-width:180px}
.people-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:12px;border-top:1px solid var(--rule)}
.people-form .btn{grid-column:1/-1;justify-self:start}
@media (max-width:520px){.people-form{grid-template-columns:1fr}}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;margin-left:auto}

/* ===== Design refresh (Nov 2026): one bright color per section, softer cards, bottom tab bar on phones.
   Visual only. Each section sets --accent; buttons, tabs, meters and headings follow it. ===== */
:root{
  --paper:#FFF7EE; --card:#FFFFFF; --ink:#1E2433; --ink-2:#4A5163; --muted:#737B8C; --rule:#ECE3D8;
  --shade:rgba(30,36,51,.06);
  --c-today:#C2410C; --c-today-soft:#FFEAD5; --c-today-hi:#FB923C;
  --c-math:#2563EB; --c-math-soft:#DCE8FF; --c-math-hi:#60A5FA;
  --c-read:#7C3AED; --c-read-soft:#EDE5FF; --c-read-hi:#A78BFA;
  --c-prog:#BE185D; --c-prog-soft:#FCE4F0; --c-prog-hi:#F472B6;
  --c-parent:#0F766E; --c-parent-soft:#D3F5EF; --c-parent-hi:#2DD4BF;
  --accent:var(--c-today); --accent-soft:var(--c-today-soft); --accent-hi:var(--c-today-hi);
  --action:var(--accent); --action-soft:var(--accent-soft); --focus:var(--accent);
  --good:#15803D; --good-soft:#DCF5E3; --warn:#9A5B00; --warn-soft:#FFF0CC; --bad:#C0262D; --bad-soft:#FFE1DF;
  --hl:#FFE27A;
  --radius:18px; --lift:0 1px 2px rgba(30,36,51,.05),0 6px 18px rgba(30,36,51,.07);
  --navh:0px; --botnav:68px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12141C; --card:#1C2030; --ink:#EEF0F6; --ink-2:#B7BDCC; --muted:#8D94A6; --rule:#2C3246; --shade:rgba(238,240,246,.07);
  --c-today:#FDBA74; --c-today-soft:#3A2414; --c-today-hi:#FB923C;
  --c-math:#93C5FD; --c-math-soft:#16264A; --c-math-hi:#60A5FA;
  --c-read:#C4B5FD; --c-read-soft:#2A1F4A; --c-read-hi:#A78BFA;
  --c-prog:#F9A8D4; --c-prog-soft:#3D1529; --c-prog-hi:#F472B6;
  --c-parent:#5EEAD4; --c-parent-soft:#0E3532; --c-parent-hi:#2DD4BF;
  --action:var(--accent); --action-soft:var(--accent-soft); --focus:var(--accent); --hl:#6B5A12;
  --action-ink:#12141C; --good:#6EE7A0; --good-soft:#123222; --warn:#FBC96B; --warn-soft:#372A0E; --bad:#FDA4A4; --bad-soft:#3E1717;
  --lift:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --paper:#12141C; --card:#1C2030; --ink:#EEF0F6; --ink-2:#B7BDCC; --muted:#8D94A6; --rule:#2C3246; --shade:rgba(238,240,246,.07);
  --c-today:#FDBA74; --c-today-soft:#3A2414; --c-math:#93C5FD; --c-math-soft:#16264A; --c-read:#C4B5FD; --c-read-soft:#2A1F4A;
  --c-prog:#F9A8D4; --c-prog-soft:#3D1529; --c-parent:#5EEAD4; --c-parent-soft:#0E3532;
  --action:var(--accent); --action-soft:var(--accent-soft); --focus:var(--accent); --hl:#6B5A12;
  --action-ink:#12141C; --good:#6EE7A0; --good-soft:#123222; --warn:#FBC96B; --warn-soft:#372A0E; --bad:#FDA4A4; --bad-soft:#3E1717;

/* tab bar: fixed at the bottom on phones and tablets in portrait, a row of pills on wide screens */

  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;min-height:56px;border:0;border-radius:14px;
  font-size:.78rem;font-weight:700;color:var(--muted);--tc:var(--accent)}

  nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);bottom:auto;display:flex;justify-content:center;gap:8px;margin:14px auto 0;width:max-content;max-width:100%;
    border:1px solid var(--rule);border-radius:999px;padding:6px;box-shadow:var(--lift)}

}

/* cards, buttons, controls */

<script>window.HUB_PASSAGES = {"F": [{"id": "F01", "title": "The Slipped Chain", "genre": "narrative", "text": "Owen had been counting down the days to the neighborhood ride for two weeks. At eight o'clock, a full hour early, he wheeled his bike out of the garage, swung one leg over the seat, and pushed down hard on the pedal.\n\nClunk. The pedal spun freely, but the bike barely moved. Owen looked down and saw the chain hanging in a loose, greasy loop below the gears.\n\n\"No, no, no,\" he groaned.\n\nHis cousin Maya, who was fifteen and staying with them for the summer, was eating cereal on the porch steps. She set down her bowl and walked over.\n\n\"It's a slipped chain,\" she said. \"That happens to everybody, and we can fix it.\"\n\n\"But I don't know how,\" Owen said.\n\n\"Then today you learn.\" Maya flipped the bike upside down so it rested on its seat and handlebars. \"See how the chain is still on the back gears? We only need to get it back onto the front ring.\"\n\nShe pointed to the big ring with sharp teeth beside the pedals. \"Hook the chain over the teeth of that ring, just a few links to start.\"\n\nOwen tried twice, but both times the chain slid right off. His fingers were already black with grease, and the clock was ticking.\n\n\"Slow down,\" Maya said. \"Hold the chain in place with your thumb, and then turn the pedal backward, nice and gently.\"\n\nOwen took a deep breath and pressed the chain onto the teeth. With his other hand, he turned the pedal backward a little at a time. The chain crept around the ring, link by link, until it caught all the way around.\n\nHe spun the pedal in a full circle, and the chain whirred smoothly over the gears.\n\n\"I did it!\" Owen said with a grin.\n\n\"You did,\" Maya said, \"but let's practice once more, just to be sure.\"\n\nShe lifted the chain off on purpose, and this time Owen fixed it in under a minute. They flipped the bike right side up, and he rode a quick lap around the driveway, feeling every push of the pedals carry him forward.\n\nAt ten minutes to nine, Owen wiped his hands on an old rag and coasted down the street toward the riders gathering at the corner."}, {"id": "F02", "title": "The Color-Changing Octopus", "genre": "informational", "text": "Imagine a sea animal that can turn from red to white in less than a second. Now imagine that same animal growing bumps that look like rocks or seaweed. This is not a magic trick. It is an octopus, and its skin is one of the most amazing in the ocean.\n\nAn octopus has no shell and no bones to protect it. Sharks, eels, and seals would all like to eat one. To stay safe, an octopus often hides in plain sight.\n\nThe secret starts with tiny color sacs in its skin called chromatophores. Its skin is packed with them. Each sac holds one pigment, such as red, yellow, brown, or black. Small muscles surround every sac. When the muscles pull, the sac stretches open wide, and its color spreads out like a drop of paint. When the muscles relax, the sac shrinks back to a tiny dot that is hard to see. The octopus controls these muscles with its nerves, so its colors can change almost instantly.\n\nBelow the color sacs are other special cells. Some reflect light and make shimmering blues and greens. Others are white and bounce back whatever light is around them. Together, these layers let an octopus make stripes, spots, and swirling patterns.\n\nColor is only half the trick. An octopus can also change its texture. Muscles in its skin raise small bumps called papillae. In a few moments, smooth skin can turn spiky like coral or rough like a rock covered in algae.\n\nOne thing still puzzles scientists. Octopuses are thought to be colorblind, yet they match their surroundings very well. Researchers are still working to learn how they do it.\n\nOctopuses do not change only to hide. They also use color to send messages. Some octopuses turn dark when they want another octopus to stay away. The blue-ringed octopus flashes bright blue circles to warn other animals that it is dangerous. The mimic octopus goes even further. It can change its shape and colors to look like a banded sea snake or a flat fish lying on the sand.\n\nSo the next time you see a lumpy rock on the ocean floor, look closely. It might be looking right back at you."}, {"id": "F03", "title": "When the Lights Went Out", "genre": "narrative", "text": "The lights blinked once, then twice, and then the whole house went dark. The refrigerator stopped humming, and the fan in the corner slowly spun to a stop. For a moment, Leo sat very still on the living room rug.\n\n\"Grandma?\" he called.\n\n\"I'm right here,\" said Grandma Rose from her armchair. \"It looks like the storm knocked out the power, so let's go find some light.\"\n\nLeo felt his way to the kitchen drawer, where he found a flashlight and a headlamp.\n\n\"Now bring me the big water jug from the pantry,\" Grandma said. \"I'll show you a trick my father taught me.\"\n\nLeo carried the heavy jug to the table. Grandma stretched the headlamp's strap around the middle of the jug, with the light pointing in toward the water. When she clicked it on, the whole jug glowed like a small moon, and soft light spread across the kitchen.\n\n\"Whoa,\" Leo said. \"How does that work?\"\n\n\"The water spreads the light out in every direction,\" Grandma explained. \"One small beam turns into a lamp for the whole room.\"\n\nAfter they ate peanut butter sandwiches by the glow of the jug, Grandma propped the flashlight on a stack of books and aimed it at the blank wall. She folded her hands together, and a rabbit with wiggling ears appeared on the wall. Then she shifted her fingers, and a bird flapped across the wall.\n\n\"Teach me the bird,\" Leo begged.\n\nHe hooked his thumbs together and spread his fingers like wings, but the shadow looked like a lumpy blob. When he tried again, his fingers kept bumping into each other.\n\n\"Keep your thumbs locked tight,\" Grandma said, \"and move all your fingers the dirt beneath it, but there was no dog.\n\n\"He was here,\" Sam said, \"and his prints lead toward the empty lot.\"\n\nAs they followed the tracks to the end of the block, the snow began falling faster, and the prints grew harder to see.\n\n\"Try the whistle,\" Nora said.\n\nSam took a deep breath and blew two short, sharp notes. They waited and listened, but nothing happened. He blew again, louder and steadier this time.\n\nFrom behind a row of bushes came the jingle of tags. Biscuit burst out with his ears flapping and snow on his nose. He raced straight to Sam and sat down at his feet, just as they had practiced.\n\nNora laughed and gave him three treats while Sam clipped the leash to his collar.\n\nBy the time they reached their front steps, the yard was already turning white. Dad opened the door, and Biscuit trotted inside and shook snow all over the hallway rug."}, {"id": "F06", "title": "Inside Your Heart", "genre": "informational", "text": "Make a fist and hold it up. That is about the size of your heart. This strong muscle sits in the middle of your chest, tilted a little to the left, tucked between your lungs. It beats more than 100,000 times a day, and it never takes a day off.\n\nThe heart's main job is to pump blood, which carries oxygen and nutrients to every part of your body. Your cells need oxygen to work, so the heart has to keep blood moving all the time.\n\nInside, the heart is divided into four rooms called chambers. The two upper chambers, called the atria, collect blood as it flows into the heart. The two lower chambers are the ventricles. They have thick, strong walls, and they squeeze hard to push blood out.\n\nA wall of muscle runs down the middle and keeps the right side apart from the left side. Each side has its own job, and together they move blood along two loops.\n\nThe first loop is short. Blood that is low on oxygen returns from the body to the right atrium. It moves down into the right ventricle, which pumps it to the lungs. In the lungs, the blood gets rid of carbon dioxide, a waste gas you breathe out. It also picks up fresh oxygen from the air you breathe in.\n\nThe second loop is long. Blood full of oxygen travels from the lungs back to the left atrium. Next, it moves down into the left ventricle, the strongest chamber of all, which must push blood all the way to your toes. Tubes called arteries carry blood away from the heart, and tubes called veins bring it back.\n\nTo keep blood flowing the right way, the heart has four valves. A valve works like a one-way door. It opens to let blood through, then snaps shut so the blood cannot flow backward. When the valves close, they make the sound a doctor hears through a stethoscope: lub-dub, lub-dub.\n\nWhen you run or jump, your muscles need more oxygen. Your heart answers by beating faster and harder. Put your hand on your chest after a race, and you can feel it pounding away."}], "M": [{"id": "M01", "title": "Why Leaves Change Color", "genre": "informational", "text": "Every fall, the trees in many parts of the world put on a bright show of color. All summer long, most leaves look green because of a [[substance|kitten|slowly]] called chlorophyll. Chlorophyll helps a leaf use [[sunlight|music|softly]], water, and air to make the tree's [[food|chair|sing]]. The tree uses part of it to [[grow|spell|happy]], and it stores the leftover [[food|noise|sang]] in its trunk and roots.\n\nChlorophyll does not [[last|laugh|purple]] forever, so a leaf must keep [[making|kicking|lazy]] fresh chlorophyll all summer to stay [[green|polite|wagon]]. When autumn arrives, the days grow [[shorter|louder|basket]] and the nights become cooler. These [[changes|pickles|hungry]] signal to the tree that winter is [[coming|baking|chair]]. To prepare, the tree stops [[making|reading|careful]] new chlorophyll, and the old chlorophyll slowly [[breaks|jumps|happy]] down.\n\nAs the green fades, other [[colors|lunches|gently]] begin to appear. Yellow and [[orange|sleepy|unde
