<script>window.__HUB_SEED__ = {"passages": {"C001": {"id": "C001", "kind": "C", "title": "The Scholar Who Tested Light", "order": 1, "status": "ready", "words": 538}, "C002": {"id": "C002", "kind": "C", "title": "Low Tide", "order": 2, "status": "ready", "words": 784}, "R001": {"id": "R001", "kind": "R", "title": "Questions Worth Researching", "stage": 1, "order": 1, "status": "ready"}}, "content": {"C001": {"schema": 1, "id": "C001", "kind": "comp", "title": "The Scholar Who Tested Light", "genre": "Biography", "topic": "Ibn al-Haytham and how we see", "passage": ["For more than a thousand years, many of the world's best thinkers believed that seeing worked a little like a flashlight. The Greek mathematician Euclid taught that the eye sends out invisible rays. When those rays touched a tree or a face, a person saw it. The idea sounded reasonable, and great scholars repeated it for centuries. Other thinkers disagreed, but no one could prove who was right. Then, around the year 1000, a scholar named Ibn al-Haytham decided to put it to a test.", "Ibn al-Haytham was born around 965 in Basra, a busy port city in what is now Iraq. As a young man he studied mathematics, astronomy, and the writings of Greek scientists, which had been translated into Arabic. Later he moved to Cairo, in Egypt. A famous story says that Egypt's ruler asked him to find a way to control the yearly floods of the Nile River. When Ibn al-Haytham saw how enormous the river was, he realized the plan could not work. According to the story, he was afraid of the ruler's anger, so he pretended to have lost his mind, and the ruler kept him shut in his house for years. Historians are not sure how much of this story is true. What historians do know is that he spent many years in Cairo writing, and that his most important work was about light.", "Ibn al-Haytham noticed problems with the flashlight idea. If the eye sends out rays, why does looking straight at the sun hurt? Why can we see distant stars the moment we open our eyes, when rays from the eye would need time to travel that far? It seemed more likely that light traveled from objects into the eye, not the other way around.", "Asking good questions was only a beginning. He wanted proof that anyone could see. He used a dark room with a small hole in one wall. Light from outside passed through the hole and made spots of light on the opposite wall. When he set several lamps outside the hole, each lamp made its own spot of light on the wall. When he covered one lamp, only its spot disappeared. To him, this showed that light moves in straight lines, from each object, through the opening, to the wall. A room like this came to be called a camera obscura, which means \"dark room\" in Latin. Centuries later, the same idea was used to build the first cameras.", "He worked this way again and again. He would state an idea, design a test, watch carefully, and only then decide whether the idea held up. He also warned his readers not to trust an idea just because a famous person had said it. Anyone who wants the truth, he wrote, should question everything he reads, and should question his own thinking too.", "His Book of Optics, written over about ten years in the early 1000s, filled seven volumes, or separate books. About two hundred years later it was translated into Latin, and scholars in Europe studied it for centuries. In 2015, when the United Nations held the International Year of Light, one of the anniversaries it celebrated was a thousand years since his Book of Optics."], "words": 538, "gist": {"model": "Ibn al-Haytham questioned an old idea about how people see and used careful experiments with light to find a better answer, and his way of testing ideas was studied for centuries.", "look": "names Ibn al-Haytham, says that he tested ideas about light with experiments, and covers the whole passage instead of one detail such as the flood story."}, "questions": [{"id": "q1", "type": "main", "q": "Which sentence best tells what the whole passage is mostly about?", "ans": {"type": "choice", "options": ["Ibn al-Haytham pretended to be ill for years so that the ruler of Egypt would not punish him for failing.", "Euclid's idea that the eye sends out invisible rays was believed for over a thousand years.", "Ibn al-Haytham tested old ideas about light with experiments and changed how people understood seeing.", "The camera obscura was the first real camera, invented in Cairo around the year 1000."], "correct": 2}, "hint": "Pick the answer that covers every paragraph, not just one part.", "why": "Each paragraph adds to the story of how he tested ideas about light. The other choices are single details, and the camera obscura was a dark room, not a camera."}, {"id": "q2", "type": "vocab", "q": "In paragraph 1, the word reasonable most nearly means", "ans": {"type": "choice", "options": ["sensible enough to believe", "hard for anyone to understand", "very old", "easy to measure"], "correct": 0}, "hint": "Reread the sentence. Great scholars repeated the idea for centuries. Why would they do that?", "why": "The idea seemed sensible, which is why scholars kept repeating it, even though it was wrong.", "para": [1]}, {"id": "q3", "type": "purpose", "q": "In paragraph 3, why does the author include the question about looking straight at the sun?", "ans": {"type": "choice", "options": ["To explain how the sun makes the light that reaches our eyes", "To show that Ibn al-Haytham had trouble seeing bright things", "To warn readers that looking straight at the sun can hurt their eyes", "To show a problem with the idea that the eye sends out rays"], "correct": 3}, "hint": "Read the first sentence of paragraph 3. What is the whole paragraph listing?", "why": "Paragraph 3 begins by saying he noticed problems with the flashlight idea. The sun question is one of those problems: light coming into the eye explains why bright light hurts.", "para": [3]}, {"id": "q4", "type": "evidence", "q": "Which two sentences from paragraph 4 best support the idea that light travels in straight lines from each object?", "ans": {"type": "multi", "options": ["When he set several lamps outside the hole, each lamp made its own spot of light on the wall.", "When he covered one lamp, only its spot disappeared.", "Centuries later, the same idea was used to build the first cameras.", "He used a dark room with a small hole in one wall."], "correct": [0, 1]}, "hint": "Look for the sentences that describe what happened in the test, not how it was set up or what came later.", "why": "Each lamp made its own spot, and covering a lamp removed only its spot. That is what you would see if light from each lamp travels in its own straight line.", "para": [4]}, {"id": "q5", "type": "infer", "q": "Paragraph 2 says historians are not sure how much of the flood story is true. Why does the author include that sentence?", "ans": {"type": "choice", "options": ["To explain why the Nile River floods its banks every year", "To show that Ibn al-Haytham was not honest with the ruler of Egypt", "To prove that the flood story about the Nile is completely false", "To show which parts of his life story are certain and which may not be"], "correct": 3}, "hint": "How is that sentence different from the flood story around it?", "why": "The author separates a story that may not be true from facts that are known. That tells readers which parts they can trust.", "para": [2]}, {"id": "q6", "type": "structure", "q": "How does paragraph 5 connect to paragraph 4?", "ans": {"type": "choice", "options": ["Paragraph 5 gives the results of the experiment that paragraph 4 describes.", "Paragraph 4 describes one experiment, and paragraph 5 says he worked that way again and again.", "Paragraph 5 argues that the experiment described in paragraph 4 was done the wrong way and failed.", "Paragraph 5 tells what Ibn al-Haytham did before the experiment in paragraph 4."], "correct": 1}, "hint": "Read the first sentence of paragraph 5. What does \"this way\" point back to?", "why": "\"He worked this way again and again\" takes the single experiment in paragraph 4 and shows it was his usual method.", "para": [4, 5]}, {"id": "q7", "type": "vocab", "q": "According to paragraph 4, what do the Latin words camera obscura mean? Type the two English words.", "ans": {"type": "text", "accept": ["dark room", "a dark room", "the dark room", "\"dark room\"", "“dark room”", "dark-room", "darkroom", "dark rooms"]}, "hint": "Find the sentence in paragraph 4 that says \"which means\".", "why": "Paragraph 4 says camera obscura means \"dark room\" in Latin.", "para": [4]}, {"id": "q8", "type": "infer", "q": "A student says, \"It must be true, because a famous scientist said it.\" Based on paragraph 5, what would Ibn al-Haytham most likely tell the student?", "ans": {"type": "choice", "options": ["Check the evidence or test it yourself before you believe it.", "Famous scientists are always right, so you can trust them.", "Once an idea is written in a book, there is no need to question it.", "Only believe ideas that were first written down in Greek."], "correct": 0}, "hint": "What did he warn his readers about in paragraph 5?", "why": "He warned readers not to trust an idea just because a famous person said it, and to question everything they read.", "para": [5]}], "write": {"kind": "paragraph", "prompt": "What made Ibn al-Haytham's way of finding answers different from the way thinkers before him found answers? Write a paragraph. Use two details from the passage and explain how each detail shows the difference.", "plan": ["Your answer in one sentence: how was his way different?", "Detail 1 from the passage, about the thinkers before him or about his questions.", "Detail 2 from the passage, about his experiment or his advice to readers.", "Explain how each detail shows the difference.", "A closing sentence that sums up your answer in new words."], "minWords": 80, "model": "Ibn al-Haytham was different because he tested ideas instead of trusting them just because famous thinkers had said them. For centuries, scholars repeated Euclid's idea that the eye sends out rays, but Ibn al-Haytham asked questions about it, such as why looking at the sun hurts if the eye is the one sending out the light. Then he looked for proof that anyone could see. In a dark room with a small hole, he set lamps outside and when he covered one lamp, only that lamp's spot disappeared. That result showed him that light travels in straight lines from objects. The thinkers before him passed an idea along, but he let careful tests decide what was true.", "look": ["answers how his way was different in the first sentence", "uses one detail about the old idea or his questions and one about his test or his advice", "explains how each detail shows testing instead of trusting"]}}, "C002": {"schema": 1, "id": "C002", "kind": "comp", "title": "Low Tide", "genre": "Story", "topic": "a choice on a rocky beach", "passage": ["\"Low tide is at two,\" Mom said, tapping the paper chart taped inside the beach house door. \"Be back at the stairs by three. The water comes in faster than you think.\"", "Noor had been waiting all summer for this afternoon. Her cousin Bilal had described the Sentinel so many times that she could picture it with her eyes closed: a tall black rock at the very tip of the point, ringed with tide pools so deep that starfish as wide as dinner plates clung to their walls. It could be reached only at low tide, he had explained, by hopping along a crooked spine of rocks that vanished completely when the water returned. Bilal had made it there last summer, and he had not stopped bragging since. Noor was eleven now, a full year older than he had been, and she intended to see those starfish for herself.", "The only obstacle was Idris. Her little brother was six, and he regarded the ocean with deep suspicion. He disliked the cold, the slippery ribbons of seaweed, and especially the way the waves hissed as they dragged back across the pebbles, as if the sea were warning him away. But Mom had a headache, and the rule was firm: Noor could go out on the rocks only if Idris came along.", "\"Stay close and step where I step,\" Noor told him at the bottom of the stairs. At 2:05 they started out.", "Idris stopped at the very first puddle. He squatted down, his nose almost touching the water. \"There's something moving,\" he whispered.", "\"It's just a snail. Come on.\" Noor pulled him up by his sleeve. Ahead of them, the line of rocks stretched toward the Sentinel like a row of stepping stones in a giant's garden.", "Idris was maddeningly slow. He tested every rock with the toe of his sneaker before trusting it with his weight, and he halted to examine a crab shell, then a gull feather, then a strand of kelp that looked, he announced, exactly like a dragon's tail. Each time, Noor said, \"Come on,\" a little louder and a little sharper. By the time they were halfway to the Sentinel, her watch read 2:35.", "That was when Idris slipped. His sneaker skidded on a green, slimy patch, and he sat down hard on the rock. When he lifted his hand, his palm was scraped and beaded with tiny dots of blood. His face crumpled.", "Noor looked toward the Sentinel. Somehow it seemed no closer than when they had started. Then she glanced down at the channel beside their rock. When they had crossed it on the way out, it had been a trickle she could step over without a second thought. Now it was a little river, swirling and widening, and the water was flowing toward the shore. Already the sea was beginning to stitch the rocks together.", "She took his good hand and led him back across the channel while she still could. On the near side, she crouched down next to him. She rinsed his hand in a clear pool and wrapped it in the bandana from her pocket. Then, because he was still sniffling, she pointed into the pool. \"Look. Don't move, and watch that shell.\"", "For a long moment nothing happened. Then two spindly legs poked out of the shell, followed by two more, and a tiny hermit crab hauled its borrowed house across the sand like someone hurrying home with an overstuffed backpack. Idris stopped sniffling. He leaned so close that his breath sent ripples across the surface.", "Together they discovered three more hermit crabs, a red sea star no bigger than a cookie, and a sea anemone that closed around Noor's fingertip like a soft, sticky flower. Idris giggled every time it squeezed. Noor showed him how to lift a rock slowly and lower it back exactly the way it had been, so that nothing living underneath would be crushed.", "At 2:50 she stood up. \"Time to head back,\" she said. \"Step where I step.\" This time she did not hurry him, and this time he did not test every rock.", "When they reached the bottom of the stairs, Noor turned around. The rocks they had crossed were vanishing one by one beneath the gray water. Far out at the end of the point, waves exploded in white sprays against the Sentinel, and the crooked path that led to it was gone.", "\"Can we come back tomorrow?\" Idris asked, holding up his bandaged hand like a prize.", "Noor ran up the stairs ahead of him, straight to the chart on the door. \"Low tide's at 2:50 tomorrow,\" she called down. \"We'll start at one.\""], "words": 784, "gist": {"model": "On her way to a famous rock at low tide, Noor stops to care for her hurt little brother and shows him the tide pools, and she gives up her goal as the tide comes back in.", "look": "tells who the story is about, what she wanted, what happened to her brother, and what she chose instead, not just one event."}, "questions": [{"id": "q1", "type": "main", "q": "Which sentence best tells what happens in the story?", "ans": {"type": "choice", "options": ["Mom stays in the beach house with a headache all afternoon while the two children play out on the beach.", "Noor gives up reaching the Sentinel to care for her brother, and they explore the tide pools instead.", "Noor reaches the Sentinel and finds the giant starfish that Bilal described to her.", "Idris is afraid of the ocean until a hermit crab makes him forget about the waves."], "correct": 1}, "hint": "The answer should cover the beginning, the middle, and the end of the story.", "why": "Only the choice about giving up the Sentinel covers the whole story: her goal, Idris getting hurt, and the tide pools. The others are single events, and Noor never reaches the Sentinel."}, {"id": "q2", "type": "infer", "q": "Why does Noor decide not to keep going to the Sentinel?", "ans": {"type": "choice", "options": ["Mom calls her back to the beach house because it is three o'clock.", "She is afraid of the tall black rock and the waves around it.", "She finds giant starfish in a pool much closer to the shore.", "Her brother is hurt, and she sees that the tide is already coming in."], "correct": 3}, "hint": "Reread paragraphs 8 and 9. What happens, and what does Noor see?", "why": "Idris has scraped his hand, and the channel they crossed has become a little river moving toward shore. The story never says she is afraid of the rock, and Mom does not call her.", "para": [8, 9]}, {"id": "q3", "type": "vocab", "q": "In paragraph 9, the author writes that the sea was \"beginning to stitch the rocks together.\" What does this mean?", "ans": {"type": "choice", "options": ["Water was filling in the gaps between the rocks, joining them like stitches join cloth.", "Waves were pushing the loose rocks closer and closer to each other.", "Long strands of slippery seaweed were slowly growing in all the cracks between the rocks.", "Someone had built a path of flat rocks leading out to the Sentinel."], "correct": 0}, "hint": "Think about what the channel looked like before and after. What is the water doing to the spaces between the rocks?", "why": "The channel had turned from a trickle into a little river. As water fills the spaces, the separate rocks start to look joined, the way stitches join two pieces of cloth.", "para": [9]}, {"id": "q4", "type": "character", "q": "Which word best describes Noor at the beginning of the story?", "ans": {"type": "choice", "options": ["frightened", "careless with the rules", "impatient", "lazy"], "correct": 2}, "hint": "What does she keep saying to Idris in paragraphs 6 and 7?", "why": "She keeps saying \"Come on,\" each time louder, and pulls him up by his sleeve. She follows Mom's rule by bringing Idris, so she is not careless with the rules.", "para": [6, 7]}, {"id": "q5", "type": "evidence", "q": "Which two sentences from late in the story show Noor acting differently than she did at the start?", "ans": {"type": "multi", "options": ["Noor looked toward the Sentinel.", "This time she did not hurry him, and this time he did not test every rock.", "\"It's just a snail. Come on.\"", "Noor showed him how to lift a rock slowly and lower it back exactly the way it had been, so that nothing living underneath would be crushed."], "correct": [1, 3]}, "hint": "Look for sentences from late in the story where she acts differently from how she acted at the start.", "why": "Late in the story she is patient with Idris and careful with the creatures in the pools. The snail line comes from the start, and looking toward the Sentinel shows nothing new about her.", "para": [6, 12, 13]}, {"id": "q6", "type": "infer", "q": "Why does the author have Mom say, \"The water comes in faster than you think,\" in paragraph 1?", "ans": {"type": "choice", "options": ["It shows that Mom does not want the children to have any fun at the beach.", "It tells the reader that the story takes place on a cold winter day.", "It is a warning that matters later, when the tide rises while they are out on the rocks.", "It explains why Mom has a headache and has to stay inside the beach house all afternoon."], "correct": 2}, "hint": "Did the water matter later in the story? Find where.", "why": "The warning comes true in paragraph 9, when Noor sees the channel filling. An early detail that pays off later helps the reader see why her choice matters.", "para": [1, 9]}, {"id": "q7", "type": "sequence", "q": "What does Noor do right after she sees that the channel has become a little river?", "ans": {"type": "choice", "options": ["She leads him back across the channel, then rinses and wraps his hand.", "She checks the tide chart taped inside the beach house door.", "She leaves Idris on the rock and runs back toward the stairs alone.", "She shows Idris how to turn over a rock without crushing anything."], "correct": 0}, "hint": "Find the paragraph that comes right after the one about the channel.", "why": "Paragraph 10 begins with her leading Idris back across the channel while she still can, then caring for his hand. The rock-turning comes later, and the chart comes at the very end.", "para": [9, 10]}, {"id": "q8", "type": "infer", "q": "At the end, Noor runs to check the chart and says, \"We'll start at one.\" What does this suggest about her?", "ans": {"type": "choice", "options": ["She wants to leave Idris at home so that she can go faster next time.", "She thinks Mom read the tide chart wrong today and gave her the wrong time for low tide.", "She has decided that she will never go out on the rocks again.", "She still wants to explore, and now she plans ahead so there is enough time before the tide."], "correct": 3}, "hint": "Low tide tomorrow is at 2:50. Why would she start almost two hours earlier?", "why": "Starting at one gives them time to go slowly and still be safe from the tide. She has not given up exploring, and she plans to go together.", "para": [16]}], "write": {"kind": "paragraph", "prompt": "How does Noor change from the beginning of the story to the end? Write a paragraph. Use two details from the story and explain what each detail shows about her.", "plan": ["Your answer in one sentence: how is Noor different at the end?", "A detail from the beginning that shows how she acts at first.", "A detail from later in the story that shows how she has changed.", "Explain what each detail shows about her.", "A closing sentence that sums up your answer in new words."], "minWords": 80, "model": "At the beginning of the story Noor cares most about reaching the Sentinel, but by the end she cares more about her brother and about planning carefully. At first she rushes Idris. When he finds something moving in a puddle, she says \"It's just a snail\" and pulls him up by his sleeve, which shows that she sees him as something slowing her down. After he gets hurt and she notices the tide coming in, she stops, takes care of his hand, and shows him hermit crabs. On the way back, \"she did not hurry him,\" which shows she has learned to be patient. Even at the end she still wants to explore, but now she checks the chart and plans to start early, so she has become more thoughtful about her brother and the sea.", "look": ["says how she changes in the first sentence", "uses one detail from the beginning and one from later", "explains what each detail shows about her"]}}, "R001": {"schema": 1, "id": "R001", "kind": "research", "stage": 1, "stageName": "Questions worth researching", "title": "Questions Worth Researching", "estMin": 40, "why": ["Every piece of research starts with a question. A doctor testing a new medicine asks whether people who take it get better faster than people who do not. A city traffic team asks which street crossings near schools have the most close calls. The question decides what they look for, who they ask and what they measure.", "Some questions take one quick search to answer. A search box or an AI tool can tell you the height of a mountain in a second. The questions that need a researcher are the ones that still leave you thinking after the first answer: questions that ask how, why or what changed, and that need facts from more than one place put together."], "ai": "Not in this unit. Today you practice asking questions, and that is the part no tool can do for you. From Stage 2 you may ask an AI, but you will treat its answer like any other source and check it in two other places.", "steps": [{"id": "s1", "type": "learn", "short": "Kinds", "title": "Three kinds of questions", "text": ["A look-up question has one answer that sits in one place. You find it, and you are done.", "A research question needs you to gather facts from more than one place and put them together to explain something. It usually asks how, why, what changed, or what happens when something is different.", "An opinion question asks what someone likes or thinks is best. Two people can give different answers and both be honest, so facts alone cannot settle it the way it is asked."], "examples": [{"label": "Look-up", "text": "How tall is Mount Everest?"}, {"label": "Research", "text": "Why does Mount Everest still grow a little taller each year?"}, {"label": "Opinion", "text": "Which mountain is the most beautiful?"}]}, {"id": "s2", "type": "quiz", "short": "Sort", "title": "Sort the questions", "intro": "Pick the kind of question. Your first answer is your score.", "questions": [{"id": "a1", "q": "In what year did people first walk on the Moon?", "ans": {"type": "choice", "options": ["Look-up question", "Research question", "Opinion question"], "correct": 0}, "hint": "How many facts would you need to answer it?", "why": "One fact found in one place answers it: 1969."}, {"id": "a2", "q": "How do beavers' dams change the streams they are built on?", "ans": {"type": "choice", "options": ["Look-up question", "Research question", "Opinion question"], "correct": 1}, "hint": "Could one fact answer this, or would you need to put several together?", "why": "You would need facts about the water, the fish, the plants and the land, from more than one source."}, {"id": "a3", "q": "Which pet is the cutest?", "ans": {"type": "choice", "options": ["Look-up question", "Research question", "Opinion question"], "correct": 2}, "hint": "Could two honest people give different answers?", "why": "It asks what someone likes. Facts cannot settle it."}, {"id": "a4", "q": "How did paper making change the way books were made in Baghdad more than a thousand years ago?", "ans": {"type": "choice", "options": ["Look-up question", "Research question", "Opinion question"], "correct": 1}, "hint": "Is there one fact to find, or a change to explain?", "why": "It asks what changed, so you would need to read about books before and after paper arrived."}, {"id": "a5", "q": "How many legs does a spider have?", "ans": {"type": "choice", "options": ["Look-up question", "Research question", "Opinion question"], "correct": 0}, "hint": "How long would it take to find the answer?", "why": "One number answers it: eight."}, {"id": "a6", "q": "How does the amount of sleep a student gets change the student's spelling quiz score the next day?", "ans": {"type": "choice", "options": ["Look-up question", "Research question", "Opinion question"], "correct": 1}, "hint": "Would one fact answer it?", "why": "You would need to collect sleep times and quiz scores and look for a pattern."}, {"id": "a7", "q": "Which tastes better for lunch, pizza or tacos?", "ans": {"type": "choice", "options": ["Look-up question", "Research question", "Opinion question"], "correct": 2}, "hint": "Does it ask for a fact or for what someone likes?", "why": "It asks about taste, and two people can honestly disagree."}, {"id": "a8", "q": "What is the capital of Japan?", "ans": {"type": "choice", "options": ["Look-up question", "Research question", "Opinion question"], "correct": 0}, "hint": "Is there one answer in one place?", "why": "One fact answers it: Tokyo."}]}, {"id": "s3", "type": "quiz", "short": "Choose", "title": "Which is the better research question?", "intro": "Each pair is about the same topic. Pick the one that would make better research.", "questions": [{"id": "b1", "q": "Both are about sharks.", "ans": {"type": "choice", "options": ["How many teeth does a great white shark have?", "Why do sharks lose and replace so many teeth in their lives?"], "correct": 1}, "hint": "Which one would still leave you thinking after the first answer?", "why": "The tooth count is one number. Explaining why sharks keep replacing teeth needs facts about how teeth grow and how sharks feed."}, {"id": "b2", "q": "Both are about space.", "ans": {"type": "choice", "options": ["How do astronauts on the space station keep their bones and muscles strong?", "What is everything about space?"], "correct": 0}, "hint": "Could anyone ever finish answering one of these?", "why": "Everything about space is too big for anyone. The astronaut question is small enough to answer and still needs several facts put together."}, {"id": "b3", "q": "Both are about recess.", "ans": {"type": "choice", "options": ["Is recess too short?", "How long is recess at schools in our town, and what do students and teachers say it changes?"], "correct": 1}, "hint": "Which one names facts you could collect?", "why": "Asking whether recess is too short gets a yes or no judgment, and people disagree on what too short means. Asking how long recess is and what it changes names facts to collect: the minutes at each school and what people report."}]}, {"id": "s4", "type": "learn", "short": "Fix", "title": "Three ways to fix a weak question", "text": ["Most good research questions start as weak ones. Researchers fix them in three ways."], "examples": [{"label": "Fix 1: turn a look-up into how or why", "text": "Look-up: In what year did the first airplane fly? Research: How did the bicycle change the way people in cities got around?"}, {"label": "Fix 2: shrink a big topic", "text": "Topic: Dinosaurs. Research: How do scientists work out how fast a dinosaur moved from the footprints it left?"}, {"label": "Fix 3: turn an opinion into something you can collect", "text": "Opinion: Which sport is the most fun? Research: Which sports do the students in my class play most, and what reasons do they give?"}]}, {"id": "s5", "type": "write", "short": "Your turn", "title": "Fix these three", "text": ["Rewrite each one as a research question. Use one of the three fixes. Write in your notebook first, then type it here."], "boxes": [{"id": "f1", "label": "1. Look-up: How tall is the Eiffel Tower?", "rows": 2, "model": "How did the engineers who built the Eiffel Tower keep such a tall iron tower steady in strong winds?"}, {"id": "f2", "label": "2. Too big: Volcanoes", "rows": 2, "model": "Why do some volcanoes explode while others let lava flow out slowly?"}, {"id": "f3", "label": "3. Opinion: Are cats better pets than dogs?", "rows": 2, "model": "How much time does a family spend each week caring for a cat compared with a dog?"}]}, {"id": "s6", "type": "pick", "short": "Topic", "title": "Pick your topic", "field": "topic", "text": ["Pick a topic you want to know more about. You will stay with it for the next few units, so pick one you are curious about."], "options": [{"label": "Animals that build", "text": "Beaver dams, termite mounds, bird nests, spider webs."}, {"label": "Space travel", "text": "Rockets, astronauts, living on the space station, the Moon."}, {"label": "Inventions", "text": "Things that changed daily life, like the bicycle, the printing press or the refrigerator."}, {"label": "Scholars of the Islamic Golden Age", "text": "Ibn al-Haytham, al-Khwarizmi, al-Jazari and others, and how their ideas spread."}, {"label": "Sports and the body", "text": "What muscles, lungs and the heart do when you play."}, {"label": "Weather", "text": "Storms, lightning, snow, and how forecasters predict them."}], "own": true, "ownLabel": "My own topic"}, {"id": "s7", "type": "write", "short": "Ask", "title": "Your own questions", "showTopic": true, "text": ["Write five questions about your topic that you want answered. Do not worry yet about whether they are good. Researchers start with many questions and keep the best ones."], "example": {"label": "See an example for the topic Bridges", "lines": ["How long is the (function () {

    reading: { hero: ['Next up'], fold: ['Where he stands', 'What to work on', 'Timed read', 'Maze score', 'School scores', 'All sessions'], label: ['Where he stands', 'Scores and history'], group: 'Plan and coaching' },
    progress: { fold: ['Why he missed', 'Books and reading log'] },

    for (var i = 2; i < p.length - 2; i += 2) d += 'Q' + p[i] + ' ' + p[i + 1] + ' ' + (p[i] + p[i + 2]) / 2 + ' ' + (p[i + 1] + p[i + 3]) / 2;
    return d + 'L' + p[p.length - 2] + ' ' + p[p.length - 1];
  }
  // A read-only picture of one question's pad: his strokes, then the tutor's on top.
  function drawing(mine, tut, paper) {
    var layers = [[(mine && mine.s) || [], null], [(tut && tut.s) || [], 'tutor']], maxY = 0, n = 0;
    layers.forEach(function (L) { L[0].forEach(function (s) { n++; for (var i = 1; i < (s.p || []).length; i += 2) if (s.p[i] > maxY) maxY = s.p[i]; }); });
    if (!n) return null;
    var h = Math.max(160, Math.ceil(maxY + 24)), wid = U, parts = [];
    layers.forEach(function (L) { L[0].forEach(function (s) { for (var i = 0; i < (s.p || []).length; i += 2) if (s.p[i] + 24 > wid) wid = Math.ceil(s.p[i] + 24); }); });
    layers.forEach(function (L) {
      L[0].forEach(function (s) {
        if (!s.p || s.p.length < 2) return;
        var c = L[1] || (s.c === 'red' ? 'red' : 'ink'), v = c === 'red' ? 'var(--bad)' : c === 'tutor' ? 'var(--spad-tutor)' : 'var(--ink)';
        parts.push('<path d="' + pathD(s.p.map(Number)) + '" style="stroke:' + v + '" stroke-width="' + (Number(s.w) || 5) + '"/>');
      });
    });
    var lines = '';
    if (paper === 'lined') { for (var y = LINE; y < h; y += LINE) lines += '<path d="M0 ' + y + 'H' + wid + '" style="stroke:var(--spad-line)" stroke-width="1.5"/>'; lines += '<path d="M' + MARGIN + ' 0V' + h + '" style="stroke:var(--spad-margin)" stroke-width="1.5"/>'; }
    var wrap = div('awork-pic' + (paper === 'lined' ? ' awork-lined' : ''));
    wrap.innerHTML = '<svg viewBox="0 0 ' + wid + ' ' + h + '" role="img" aria-label="Drawing from his scratch pad" fill="none" stroke-linecap="round" stroke-linejoin="round">' + lines + parts.join('') + '</svg>';
    return wrap;
  }

  window.HubScratch = {
    layout: function (card, o) {
      Object.keys(cache).forEach(function (k) { if (k !== o.key) cache[k].close(true); });
      var r0 = role();
      if ((r0 === 'tutor' || r0 === 'parent') && db() && o.paper === 'lined') {
        // writing: adults see his pad only once he hands it in, on the Marks page; nothing is watched while he writes
        var nt = div('spad-adultnote small muted', 'You see his writing once he hands it in. It is on the Marks page then.');
        card.append(nt);
        return card;
      }
      var pad = cache[o.key];
      if (pad) { delete cache[o.key]; cache[o.key] = pad; pad.refresh(); }    // most recently used last
      else {
        var r = role(), adult = (r === 'tutor' || r === 'parent') && !!db();
        // the tutor and the parent see his pad for this question, live; the tutor writes on it in purple
        pad = cache[o.key] = adult ? makePad('adult:' + o.key, { mode: 'tutor', inline: true, view: r !== 'tutor', lessonId: o.lessonId, qid: o.qid, paper: o.paper })
          : makePad(o.key, { mode: r === 'student' ? 'student' : 'local', lessonId: o.lessonId, qid: o.qid, paper: o.paper, answer: o.answer });
      }
      // keep only a few pads in memory; each one's work is already on the device and sent or queued to send
      var keys = Object.keys(cache); while (keys.length > CACHE_MAX) delete cache[keys.shift()];
      pad.setQuestion(o.label, o.text);
      if (pad.setLocked) pad.setLocked(!!o.locked);
      var main = div('qmain'); main.append(card);
      var side = div('qside'); side.append(pad.el);
      var wrap = div('qlayout'); wrap.append(main, side);
      pad.watch(card, wrap);
      requestAnimationFrame(function () { pad.size(); });
      return wrap;
    },
    closeAll: function () { Object.keys(cache).forEach(function (k) { cache[k].close(true); }); },
    // His work and the tutor's notes for one lesson, keyed by question id.
    lesson: function (lessonId) {
      if (!db()) return Promise.resolve({ mine: localWork(lessonId), tutor: {} });
      return Promise.all([rList('scratch', lessonId), rList('scratchtutor', lessonId)]).then(function (r) { return { mine: r[0], tutor: r[1] }; });
    },
    /* The answer book while it is open: reads his working and the tutor's notes every few seconds and calls onChange
       with the new set when it differs from what now() says is shown. onChange returns false when it could not show
       it yet (for example, someone is typing a remark), so the next read tries again. Returns a stop function. */
    live: function (lessonId, now, onChange) {
      var stop = false, t = null, heard = 0, polled = 0, at = { his: {}, tut: {} }, links = [];
      // The live link brings each change as he (or the tutor) writes it; the reads below then only check now and then.
      function hear(layer) {
        return function (m) {
          if (stop || !m || !m.qid) return; heard = Date.now(); if (m.ping) return;
          var ms = +m.at || Date.now(); if (ms <= (at[layer][m.qid] || 0)) return; at[layer][m.qid] = ms;
          var cur = now(); if (!cur || tutorPad) return;                     // not showing yet: the next read brings it
          var k = layer === 'his' ? 'mine' : 'tutor', d = { mine: cur.mine, tutor: cur.tutor };
          d[k] = Object.assign({}, cur[k]);
          d[k][m.qid] = Object.assign({}, cur[k][m.qid] || { lessonId: lessonId, qid: m.qid }, { s: m.s || [], t: m.t || '', at: new Date(ms).toISOString(), atMs: ms });
          onChange(d);
        };
      }
      ['his', 'tut'].forEach(function (layer) { var l = link('pad:' + layer + ':' + lessonId, hear(layer)); if (l) links.push(l); });
      function next() { if (!stop) t = setTimeout(tick, LIVE_MS); }
      function tick() {
        if (stop) return;
        if (!db() || document.visibilityState === 'hidden' || tutorPad) { next(); return; }
        if (Date.now() - heard < LINK_FRESH && Date.now() - polled < LINK_POLL) { next(); return; }
        polled = Date.now();
        Promise.all([rList('scratch', lessonId, true), rList('scratchtutor', lessonId, true)]).then(function (r) {
          if (stop) return;
          if (r[0] && r[1]) {
            var cur = now() || {};
            [['mine', 'his', r[0]], ['tutor', 'tut', r[1]]].forEach(function (x) {      // a saved copy older than what the link showed: keep the newer
              Object.keys(at[x[1]]).forEach(function (qid) { if (msOf(x[2][qid]) < at[x[1]][qid] && cur[x[0]] && cur[x[0]][qid]) x[2][qid] = cur[x[0]][qid]; });
            });
            var d = { mine: r[0], tutor: r[1] }; if (JSON.stringify(d) !== JSON.stringify(now())) onChange(d);
          }
          next();
        }, next);
      }
      next();
      return function () { stop = true; clearTimeout(t); links.forEach(function (l) { l.close(); }); };
    },
    canTutor: function () { return role() === 'tutor' && !!db(); },
    // What is on his pad for this key now (the pad on screen, or what this device kept), or null.
    mine: function (key) {
      var p = cache[key]; if (p && p.snap) { var v = p.snap(); return has(v) ? v : null; }
      var l = lsGet(key); return l && has(l) ? { s: l.s || [], t: l.t || '' } : null;
    },
    hasWork: function (key) { return !!HubScratch.mine(key); },
    /* He handed in the step this pad belongs to: lock the pad and keep his final answer as its own row,
       scratch/<lessonId>.<qid>.f<n> with lessonId 'final:<lessonId>'. n counts hand-ins of the same step (1 the first
       time). The copy is taken now, before anything is sent, so what he handed in is exactly what he saw.
       Returns { has, n, at, done } where done is a promise of 'ok', 'fail' or 'local' (not signed in). */
    finalize: function (o) {
      var key = o.lessonId + '.' + o.qid, p = cache[key], v = HubScratch.mine(key), n = o.n || 1, ms = Date.now();
      if (p && p.setLocked) p.setLocked(true);
      var res = { has: !!v, n: n, at: new Date(ms).toISOString() };
      if (!v || role() !== 'student' || !db()) { res.done = Promise.resolve(v ? 'local' : 'empty'); return res; }
      var body = { lessonId: 'final:' + o.lessonId, qid: o.qid, of: key, n: n, s: v.s, t: v.t || '', w: U, at: res.at, atMs: ms };
      res.done = (p ? p.flush() : Promise.resolve()).then(function () { return rSet('scratch/' + key + '.f' + n, body); })
        .then(function (r) { if (r === 'fail') { var t = setInterval(function () { rSet('scratch/' + key + '.f' + n, body).then(function (r2) { if (r2 === 'ok') clearInterval(t); }); }, 20000); } return r; });
      return res;
    },
    // His handed-in answers for one lesson, keyed by qid (the newest hand-in of each step).
    finals: function (lessonId) {
      if (!db()) return Promise.resolve({});
      var d = db();
      return d.collection('scratch').where('lessonId', '==', 'final:' + lessonId).get().then(function (snap) {
        var out = {}; snap.docs.forEach(function (x) { var v = x.data(); if (v && v.qid && (!out[v.qid] || (v.n || 1) > (out[v.qid].n || 1))) out[v.qid] = copy(v); }); return out;
      }, function () { return {}; });
    },
    drawing: function (v, paper) { return drawing(v, null, paper); },
    /* A card for a marking screen outside math (Read and write, Research): his pad for each step that has work on it,
       with the tutor's way to write on it. items: [{qid, label, text}]. Hidden while nothing is on any pad. */
    workCard: function (lessonId, items, when, paper) {
      var card = div('card spad-workcard'); card.hidden = true;
      var h = document.createElement('h2'); h.textContent = 'His pad'; card.append(h);
      var body = div('spad-workbody'); card.append(body);
      function fill() {
        Promise.all([HubScratch.lesson(lessonId), HubScratch.finals(lessonId)]).then(function (r) {
          var d = r[0], fin = r[1];
          body.replaceChildren(); var any = false;
          items.forEach(function (it) {
            var f = fin[it.qid], wm = f || d.mine[it.qid], wt = d.tutor[it.qid], v = HubScratch.view(wm, wt, when, f ? 'His final answer' : null, paper);
            if (!v) return;
            any = true;
            var row = div('spad-workrow'), lb = document.createElement('p'); lb.className = 'spad-worklbl'; lb.textContent = it.label;
            row.append(lb, v);
            if (HubScratch.canTutor()) {
              var b = document.createElement('button'); b.className = 'linkbtn noprint'; b.type = 'button';
              b.textContent = wt ? 'Change your notes on his pad' : 'Write on his pad to explain';
              b.addEventListener('click', function () { HubScratch.openTutor({ lessonId: lessonId, qid: it.qid, label: it.label, text: it.text || '', paper: paper }, function () { if (window.Hub && window.Hub.toast) window.Hub.toast('Saved. He sees it on his pad.'); fill(); }); });
              row.append(b);
            }
            body.append(row);
          });
          card.hidden = !any;

      }
      fill();
      return card;
    },
    // The answer-book block for one question, or null when there is nothing to show.
    view: function (mine, tut, when, label, paper) {
      if (!has(mine) && !has(tut)) return null;
      var box = div('awork' + (label ? ' awork-final' : '')), head = div('awork-head');
      var lbl = document.createElement('span'); lbl.className = 'label'; lbl.textContent = label || 'His working';
      var stamp = document.createElement('span'); stamp.className = 'small muted';
      stamp.textContent = [has(mine) ? (label ? 'Handed in ' : 'Saved ') + when(mine.at) : 'Nothing on his pad', has(tut) ? 'tutor notes ' + when(tut.at) : ''].filter(Boolean).join(', ');
      head.append(lbl, stamp); box.append(head);
      var pic = drawing(mine, tut, paper); if (pic) box.append(pic);
      if (mine && mine.t && String(mine.t).trim()) box.append(div('awork-text', mine.t));
      if (tut && tut.t && String(tut.t).trim()) { var t = div('awork-text tut'), b = document.createElement('b'); b.textContent = 'Tutor: '; t.append(b, document.createTextNode(tut.t)); box.append(t); }
      if (has(tut)) box.append(div('awork-key small muted', 'Purple is the tutor’s writing. He can hide it on his pad.'));
      return box;
    },
    // The tutor's pad over his work, full screen. Calls back after the last save when the tutor taps Done.
    openTutor: function (o, onClose) {
      if (tutorPad) return Promise.resolve(tutorPad);                 // already open
      var path = o.lessonId + '.' + o.qid, pad, opening = { el: null };
      tutorPad = opening;
      return Promise.all([rGet('scratch/' + path), rGet('scratchtutor/' + path)]).then(function (r) {
        if (r[0] === undefined || r[1] === undefined) {                // a failed read is not an empty pad: do not open over it
          tutorPad = null;
          if (window.Hub && window.Hub.toast) window.Hub.toast('Could not load his pad. Check the connection and try again.');
          return null;
        }
        pad = makePad('tutor:' + path, { mode: 'tutor', lessonId: o.lessonId, qid: o.qid, paper: o.paper, his: r[0] || {}, mine: r[1] || {}, onDone: function () {
          pad.flush().then(function (res) {
            if (res === 'fail' || res === 'big') return;              // keep the pad open; the footer says what to do
            document.documentElement.classList.remove('spad-lock'); pad.el.remove(); tutorPad = null;
            if (onClose) onClose();
          });
        } });
        tutorPad = pad;
        pad.setQuestion(o.label, o.text);
        document.body.append(pad.el); document.documentElement.classList.add('spad-lock');
        setTimeout(function () { var b = pad.el.querySelector('.spad-done'); if (b) b.focus(); }, 0);
        return pad;
      });
    }
  };
  function sizeAll() { Object.keys(cache).forEach(function (k) { cache[k].size(); }); }
  // Safari's bars shrinking and growing while he scrolls also fire resize; only a real change resizes the pad
  var lastW = window.innerWidth, lastH = window.innerHeight;
  window.addEventListener('resize', function () {
    var w = window.innerWidth, h = window.innerHeight;
    if (w === lastW && Math.abs(h - lastH) < 100) return;

  window.addEventListener('orientationchange', function () { setTimeout(function () { lastW = window.innerWidth; lastH = window.innerHeight; sizeAll(); }, 250); });
  /* Work saved on this iPad that did not reach the server (the page closed while offline) is sent when the hub next
     opens, and again when the connection comes back, not only when that question is opened again. */
  var swept = false;
  function sweep() {
    if (role() !== 'student' || !db()) return;
    var keys = [];
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf(PRE) === 0) keys.push(k.slice(PRE.length)); } } catch (e) { return; }
    keys.forEach(function (k) {
      var v = lsGet(k), dot = k.indexOf('.');
      if (!v || !v.pend || cache[k] || dot < 1) return;
      var pad = makePad(k, { mode: 'student', lessonId: k.slice(0, dot), qid: k.slice(dot + 1) });
      setTimeout(function () { pad.flush().then(function () { pad.close(true); }); }, 1500);
    });
  }
  setInterval(function () {
    if (document.visibilityState === 'hidden') return;
    if (!swept && db() && role()) { swept = true; sweep(); }
    Object.keys(cache).forEach(function (k) { cache[k].live(); });
    if (tutorPad && tutorPad.live) tutorPad.live();
  }, LIVE_MS);
  function flushAll() { Object.keys(cache).forEach(function (k) { cache[k].flush(); }); if (tutorPad && tutorPad.flush) tutorPad.flush(); }
  window.addEventListener('online', function () { flushAll(); sweep(); });
  window.addEventListener('pagehide', flushAll);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flushAll(); });
})();
</script>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  function go(){
    if(!window.Hub||!Hub.store||!Hub.store.ready) return setTimeout(go,50);
    Hub.store.ready.then(function(){
      var v = qs.get('view') || 'write';
      if (v === 'mark') Hub.go('write', { mode: 'mark', set: 'C002', from: 'reading' });
      else if (v === 'research') Hub.go('research', { unit: 'R001', from: 'reading' });
      else Hub.go('write', { set: 'C001', from: 'reading' });
      if (qs.get('top') !== '1') setTimeout(function(){ var sp=document.querySelector('.spad, .spad-workcard'); if(sp) window.scrollTo(0, sp.getBoundingClientRect().top + window.scrollY - 70); }, 2500);
    });
  }
  go();
})();
